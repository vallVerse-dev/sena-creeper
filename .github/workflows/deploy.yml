name: CI/CD Pipeline con Seguridad

on:
  push:
    branches: ["main"]

jobs:
  test-and-security:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest bandit

      - name: Escaneo de seguridad (Bandit)
        run: bandit -r backend -s B104

      - name: Ejecutar pruebas pytest
        run: pytest test_app.py

  build-and-push:
    needs: test-and-security
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v3

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Construir imagen backend
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: false
          load: true
          no-cache: true
          tags: ${{ secrets.DOCKER_USERNAME }}/sena-creeper-backend:latest

      - name: Escanear imagen con Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/sena-creeper-backend:latest
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'library'
          severity: 'CRITICAL'
          ignorefile: './.trivyignore'

      - name: Subir imagen a Docker Hub
        run: docker push ${{ secrets.DOCKER_USERNAME }}/sena-creeper-backend:latest

      - name: Desplegar en el servidor
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ~/sena-creeper
            git pull origin main
            docker-compose pull backend
            docker-compose up -d --force-recreate backend
